name: VM Tests

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
  schedule:
    # Nightly full-suite run against the current daily ISO (UTC).
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmtest-${{ github.ref }}
  cancel-in-progress: true

env:
  ISO_NAME: tenacious-live-server-amd64.iso
  ISO_URL: https://cdimage.ubuntu.com/ubuntu-server/tenacious/daily-live/current
  # Stage the test ISO into libvirt's default pool, where qemu can read it
  # under the stock AppArmor profile.
  ISO_DIR: /var/lib/libvirt/images

jobs:
  # Build the subiquity snap for the code under test: the PR branch for
  # pull requests, main for the nightly and manually triggered runs.
  # The Snap workflow still builds on pushes to the default branch.
  snap-build:
    name: build snap
    runs-on: ubuntu-26.04
    outputs:
      subiquity: ${{ steps.upload-snap.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: build subiquity snap
        uses: canonical/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79  # v1
        id: build-snap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        id: upload-snap
        with:
          name: subiquity.snap
          path: ${{ steps.build-snap.outputs.snap }}

  # PR smoke test: one BIOS direct-layout autoinstall, the canary for
  # the installer pipeline.
  vmtest:
    name: bios direct
    if: github.event_name == 'pull_request'
    needs: snap-build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # apt deps, libvirt config, /dev/kvm check, snap + daily ISO
      # download, test ISO build (see ./.github/actions/vmtest-prepare)
      - uses: ./.github/actions/vmtest-prepare
        id: prepare
        with:
          iso-name: ${{ env.ISO_NAME }}
          iso-url: ${{ env.ISO_URL }}
          iso-dir: ${{ env.ISO_DIR }}
          snap-artifact-id: ${{ needs.snap-build.outputs.subiquity }}

      - name: run vmtest
        env:
          TEST_ISO: ${{ steps.prepare.outputs.test-iso }}
        run: |
          sudo PYTHONPATH=. pytest-3 -v \
            --iso="$TEST_ISO" \
            -k test_bios_direct vmtests

      # diagnostics and installer-log upload, only when something
      # failed (see ./.github/actions/vmtest-diagnostics)
      - uses: ./.github/actions/vmtest-diagnostics
        if: failure()

      # clean up leftover VM state and staged files, whatever happened
      # (see ./.github/actions/vmtest-cleanup)
      - uses: ./.github/actions/vmtest-cleanup
        if: always()
        with:
          iso-name: ${{ env.ISO_NAME }}

  # Nightly (and manually triggered) run of the full suite against the
  # current daily ISO.
  vmtest-full:
    name: full suite
    if: github.event_name != 'pull_request'
    needs: snap-build
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # apt deps, libvirt config, /dev/kvm check, snap + daily ISO
      # download, test ISO build (see ./.github/actions/vmtest-prepare)
      - uses: ./.github/actions/vmtest-prepare
        id: prepare
        with:
          iso-name: ${{ env.ISO_NAME }}
          iso-url: ${{ env.ISO_URL }}
          iso-dir: ${{ env.ISO_DIR }}
          snap-artifact-id: ${{ needs.snap-build.outputs.subiquity }}

      - name: run full vmtest suite
        env:
          TEST_ISO: ${{ steps.prepare.outputs.test-iso }}
        run: |
          sudo PYTHONPATH=. pytest-3 -v \
            --iso="$TEST_ISO" \
            vmtests

      # diagnostics and installer-log upload, only when something
      # failed (see ./.github/actions/vmtest-diagnostics)
      - uses: ./.github/actions/vmtest-diagnostics
        if: failure()

      # clean up leftover VM state and staged files, whatever happened
      # (see ./.github/actions/vmtest-cleanup)
      - uses: ./.github/actions/vmtest-cleanup
        if: always()
        with:
          iso-name: ${{ env.ISO_NAME }}
